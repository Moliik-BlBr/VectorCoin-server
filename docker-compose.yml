services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vectorcoin
      POSTGRES_USER: vectorcoin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - vectorcoin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorcoin -d vectorcoin"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://vectorcoin:${POSTGRES_PASSWORD}@db:5432/vectorcoin
      PGSSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  vectorcoin_pg:
